# croScan behind the company's sign-in (design §12.3 운영 인증, server/app.py _gate with CROSCAN_AUTH=proxy).
# oauth2-proxy signs the user in against the company IdP (OIDC); nginx asks it on every request (auth_request) and
# passes on only two headers, set here and nowhere else: who (X-Croscan-User) and the role (X-Croscan-Role) from the
# IdP groups. A header of the same name sent by the browser is overwritten (proxy_set_header always sets it), so a
# user cannot make himself a manager. croScan itself is reachable only from this proxy (not published).

map $croscan_groups $croscan_role {
    default                             "";
    "~*(^|,)\s*croscan-manager\s*(,|$)" manager;     # 안전관리자 group in the IdP
    "~*(^|,)\s*croscan-foreman\s*(,|$)" foreman;     # 작업반장 group
}

server {
    listen 443 ssl;
    server_name croscan.example.internal;             # the company's host name
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    client_max_body_size 64m;                         # permits and plans are uploaded as PDF

    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # the app's health check stays open (Docker HEALTHCHECK, the gateway's own monitor)
    location = /api/health {
        proxy_pass http://croscan:8765;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        auth_request_set $croscan_user   $upstream_http_x_auth_request_user;
        auth_request_set $croscan_groups $upstream_http_x_auth_request_groups;

        # set here, and only here: anything the browser sent under these names is replaced
        proxy_set_header X-Croscan-User $croscan_user;
        proxy_set_header X-Croscan-Role $croscan_role;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;                      # a model reading may take a while (design §10)
        proxy_pass http://croscan:8765;
    }
}
